# The Olympus Production Engine — 13 steps
production_engine:
  - step: "IDEA"
    icon: "bulb"
  - step: "RESEARCH"
    icon: "search"
  - step: "EDITORIAL"
    icon: "document"
  - step: "CREATIVE REVIEW"
    icon: "person"
  - step: "STORYBOARDS"
    icon: "film"
  - step: "VISUAL PRODUCTION"
    icon: "clapper"
  - step: "NARRATION"
    icon: "mic"
  - step: "ASSEMBLY"
    icon: "gear"
