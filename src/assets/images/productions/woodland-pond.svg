<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="wp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B4332"/>
      <stop offset="100%" style="stop-color:#081C15"/>
    </linearGradient>
    <linearGradient id="wp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#F5D76E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wp-bg)"/>
  <!-- Trees -->
  <g fill="#2D6A4F" opacity="0.6">
    <polygon points="80,280 120,120 160,280"/>
    <polygon points="140,300 190,90 240,300"/>
    <polygon points="370,290 420,100 470,290"/>
    <polygon points="450,280 500,130 550,280"/>
  </g>
  <!-- Pond -->
  <ellipse cx="300" cy="340" rx="200" ry="40" fill="#1B4332" stroke="#2D6A4F" stroke-width="1"/>
  <ellipse cx="300" cy="340" rx="180" ry="30" fill="#1B4332" opacity="0.5"/>
  <!-- Animals -->
  <g transform="translate(250, 260)">
    <!-- Rabbit body -->
    <ellipse cx="0" cy="0" rx="18" ry="25" fill="#E8D5B7"/>
    <circle cx="0" cy="-30" r="14" fill="#E8D5B7"/>
    <ellipse cx="8" cy="-55" rx="4" ry="14" fill="#E8D5B7"/>
    <ellipse cx="-8" cy="-55" rx="4" ry="14" fill="#E8D5B7"/>
    <circle cx="5" cy="-35" r="2" fill="#1B4332"/>
    <circle cx="-5" cy="-35" r="2" fill="#1B4332"/>
  </g>
  <g transform="translate(320, 300)">
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#F4A261"/>
    <circle cx="0" cy="-12" r="10" fill="#F4A261"/>
    <path d="M-8,-12 Q-12,-20 -8,-25" stroke="#F4A261" stroke-width="2" fill="none"/>
    <path d="M8,-12 Q12,-20 8,-25" stroke="#F4A261" stroke-width="2" fill="none"/>
    <circle cx="3" cy="-14" r="1.5" fill="#1B4332"/>
    <circle cx="-3" cy="-14" r="1.5" fill="#1B4332"/>
  </g>
  <!-- Title -->
  <text x="300" y="195" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="32" font-weight="700" fill="url(#wp-gold)" letter-spacing="4">WOODLAND POND</text>
  <text x="300" y="225" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="14" fill="#A0A0B8" letter-spacing="2">FAMILY ADVENTURES. NATURE. LIFE LESSONS.</text>
</svg>