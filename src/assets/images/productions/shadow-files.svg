<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="sf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A14"/>
      <stop offset="50%" style="stop-color:#1A0A0A"/>
      <stop offset="100%" style="stop-color:#0A0A14"/>
    </linearGradient>
    <linearGradient id="sf-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8A838"/>
      <stop offset="50%" style="stop-color:#F5C542"/>
      <stop offset="100%" style="stop-color:#C47A1A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sf-bg)"/>
  <!-- File folder shape -->
  <g transform="translate(300, 190)" fill="none" stroke="url(#sf-amber)" stroke-width="1.5" opacity="0.3">
    <path d="M-80,-40 L-60,-40 L-40,-60 L40,-60 L80,-40 L80,60 L-80,60 Z"/>
  </g>
  <!-- File lines -->
  <g stroke="#E8A838" stroke-width="1" opacity="0.15">
    <line x1="240" y1="200" x2="360" y2="200"/>
    <line x1="250" y1="215" x2="350" y2="215"/>
    <line x1="260" y1="230" x2="340" y2="230"/>
  </g>
  <!-- Evidence markers -->
  <g fill="none" stroke="#E8A838" stroke-width="0.5" opacity="0.4">
    <circle cx="180" cy="140" r="30"/>
    <circle cx="180" cy="140" r="20"/>
    <circle cx="180" cy="140" r="5" fill="#E8A838"/>
    <circle cx="420" cy="150" r="25"/>
    <circle cx="420" cy="150" r="15"/>
    <circle cx="420" cy="150" r="4" fill="#E8A838"/>
    <circle cx="150" cy="280" r="20"/>
    <circle cx="150" cy="280" r="4" fill="#E8A838"/>
    <circle cx="450" cy="270" r="18"/>
    <circle cx="450" cy="270" r="3.5" fill="#E8A838"/>
  </g>
  <!-- Connecting lines -->
  <g stroke="#E8A838" stroke-width="0.5" opacity="0.2">
    <line x1="180" y1="170" x2="300" y2="190"/>
    <line x1="420" y1="175" x2="300" y2="190"/>
    <line x1="150" y1="260" x2="300" y2="230"/>
    <line x1="450" y1="252" x2="300" y2="230"/>
  </g>
  <!-- Title -->
  <text x="300" y="340" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="34" font-weight="700" fill="url(#sf-amber)" letter-spacing="5">SHADOW FILES</text>
  <text x="300" y="370" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="12" fill="#808080" letter-spacing="3">UNSOLVED. UNFORGOTTEN. UNEARTHED.</text>
</svg>