<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600">
  <defs>
    <linearGradient id="prod-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A14"/>
      <stop offset="50%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#0A0A14"/>
    </linearGradient>
    <linearGradient id="prod-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="600" fill="url(#prod-bg)"/>
  <rect width="1440" height="600" fill="url(#prod-glow)"/>
  <!-- Film strip accent -->
  <g fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.1">
    <rect x="200" y="50" width="1040" height="500" rx="5"/>
    <rect x="220" y="70" width="1000" height="460" rx="3"/>
  </g>
  <!-- Sprocket holes -->
  <g fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.08">
    <circle cx="250" cy="80" r="5"/>
    <circle cx="250" cy="130" r="5"/>
    <circle cx="250" cy="180" r="5"/>
    <circle cx="250" cy="230" r="5"/>
    <circle cx="250" cy="280" r="5"/>
    <circle cx="250" cy="330" r="5"/>
    <circle cx="250" cy="380" r="5"/>
    <circle cx="250" cy="430" r="5"/>
    <circle cx="1190" cy="80" r="5"/>
    <circle cx="1190" cy="130" r="5"/>
    <circle cx="1190" cy="180" r="5"/>
    <circle cx="1190" cy="230" r="5"/>
    <circle cx="1190" cy="280" r="5"/>
    <circle cx="1190" cy="330" r="5"/>
    <circle cx="1190" cy="380" r="5"/>
    <circle cx="1190" cy="430" r="5"/>
  </g>
  <!-- Bottom fade -->
  <rect x="0" y="500" width="1440" height="100" fill="url(#prod-bg)" opacity="0.8"/>
</svg>